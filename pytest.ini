# pytest.ini — 限制收集范围, 让 "跑测试" 这件事可复现
# =====================================================================
# 为什么必须有这个文件 (jihua20260905.md §2.3 / §12):
#
#   仓库根散落 17 个根级 test_*.py 和一批研究脚本 (test_v4_all.py、
#   test_zmq.py、test_conn.py、ablation_study_v2/v3.py ...)。在没有配置的
#   情况下 `pytest -q` 会在仓库根全量收集 —— 实测 8 分钟仍未结束, 期间还会
#   去连真实 socket, 退出码既不可复现也不可解释。
#
#   "测试脚本返回 0" 不等于 "关键测试通过"。所以这里把**受维护套件**显式钉死:
#   计划 §2.2 记录的 76 passed / 1 skipped 指的就是 src/puppy_minicpm_robot/test,
#   加上 §5.2 新增的 bridge 单位换算单测。
#
# 不再受维护的根级 test_*.py 属 research-only, 由 scripts/check_docs_consistency.py
# 与 docs/test_inventory.md 标记, 不进入发布门禁。

[pytest]
testpaths =
    src/puppy_minicpm_robot/test
    cpp_src/bridge/test_bridge_units.py

# 研究/遗留目录: 明确排除, 避免误收集产生"看起来在测"的假象
norecursedirs =
    .git
    .workbuddy
    archive
    robot_src
    third_party
    build
    __pycache__
    .pytest_cache
    node_modules

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 单测不应依赖网络/端口; 需要真实 ROS2 环境的用例必须显式 skip 并写明原因
# (见 docs/test_inventory.md 的 skipped 清单)。
addopts =
    --strict-markers
    -p no:cacheprovider
    -p no:launch_ros
    -p no:launch_testing

markers =
    ros_required: 需要真实 ROS2 环境 (WSL), 无环境时 skip 并写明原因
    slow: 长耗时用例, 默认仍执行; 快跑用 -m "not slow" 过滤
