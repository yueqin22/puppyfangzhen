# 统一参数配置 (P1-6)
# ====================================================
# C++ 和 Python 共享的单一参数源。
# 优先级: 命令行 > 环境变量 > 本文件 > 代码默认值
#
# C++ 读取方式: sim/mini_yaml.h 解析本文件
# Python 读取方式: config_loader.py / unified_config.py
#
# 环境变量映射:
#   USE_AMCL → navigation.use_amcl
#   USE_RVO  → navigation.use_rvo
#   SEED     → sim.seed
#   PROFILE  → profile

profile: dev  # dev / benchmark / demo / research / raspberry_pi

# =====================================================================
# 仿真参数
# =====================================================================
sim:
  dt: 0.0333              # 仿真步长 (s) = 30Hz
  max_frames: 108000      # 最大帧数 (1小时 @30Hz)
  seed: 0                 # 随机种子, 0=随机
  scene_file: ""          # 场景文件路径 (空=默认)

# =====================================================================
# 导航开关
# =====================================================================
navigation:
  use_amcl: true          # AMCL 定位 (USE_AMCL 环境变量覆盖)
  use_rvo: true           # RVO/VO 避障 (USE_RVO 环境变量覆盖)
  use_imu_fusion: true    # IMU+LiDAR 互补滤波
  use_teb: true           # TEB 局部规划器 (USE_TEB 环境变量覆盖)
  use_eval: false         # 评估模式 (USE_EVAL 环境变量覆盖)

# =====================================================================
# 机器人参数
# =====================================================================
robot:
  radius: 0.35            # 机器人半径 (m)
  max_linear_x: 0.3       # 最大线速度 (m/s)
  max_angular_z: 1.2      # 最大角速度 (rad/s)
  arrival_radius: 0.35    # 到达目标判定半径 (m)
  cmd_timeout: 1          # 指令超时 (s)

# =====================================================================
# AMCL 参数
# =====================================================================
amcl:
  n_particles: 300        # 最大/初始粒子数
  sigma_obs: 0.45         # 观测模型 sigma (m)
  z_max: 8.0              # LiDAR 最大量程 (m)
  n_obs_rays: 72          # 观测光线数
  kld_min: 50             # KLD 最小粒子数
  kld_max: 500            # KLD 最大粒子数
  kld_epsilon: 0.05       # KL 距离误差上界
  kld_delta: 0.99         # KL 误差 < epsilon 的概率
  alpha1: 0.08            # 旋转→旋转噪声
  alpha2: 0.04            # 平移→旋转噪声
  alpha3: 0.04            # 平移→平移噪声
  alpha4: 0.08            # 旋转→平移噪声
  kidnap_window: 20       # kidnapping 检测历史窗口
  kidnap_consecutive: 10  # 连续低似然帧数阈值
  kidnap_likelihood_thresh: 0.01  # 似然阈值
  kidnap_recover_spread: 2.0      # kidnapping 恢复 spread

# =====================================================================
# Costmap 参数
# =====================================================================
costmap:
  resolution: 0.1         # 栅格分辨率 (m/cell)
  inflation_radius: 0.43  # = simulation_contract.planning.inflation_radius
  obstacle_threshold: 0.6 # log-odds 障碍物阈值

# =====================================================================
# 路径规划参数
# =====================================================================
planner:
  # 全局规划 (A*)
  astar_grid_resolution: 0.1
  astar_diagonal_cost: 1.414

  # 局部规划 (TEB)
  teb_w_time: 0.3         # 时间最优权重
  teb_w_jerk: 0.4         # Jerk 约束权重
  teb_dt_ref: 0.3         # 参考时间步
  teb_max_vel_x: 0.5      # 最大线速度
  teb_max_vel_theta: 1.0  # 最大角速度

# =====================================================================
# 避障参数
# =====================================================================
obstacles:
  dynamic_clearance: 1.5    # 动态障碍物检测半径 (m)
  collision_radius: 0.55    # 行人碰撞半径 (m)
  near_miss_threshold: 0.7  # 近距事件阈值 (m)

# =====================================================================
# 安全参数
# =====================================================================
safety:
  low_battery: 20          # 低电池阈值 (%)
  critical_battery: 10     # 危险电池阈值 (%)
  motors_enabled_on_start: true
  emergency_stop_timeout: 0.5  # 紧急停止超时 (s)

# =====================================================================
# 性能监控参数 (P1-3)
# =====================================================================
monitoring:
  latency_timeout_ms: 50   # 单帧超时阈值 (ms)
  control_frequency_hz: 30 # 目标控制频率 (Hz)
  amcl_max_time_ms: 30     # AMCL 单帧最大耗时 (ms)

# =====================================================================
# 运行 Profile (jihua20260905.md §11 第 1 周出口)
# =====================================================================
# 顶部 profile: 选择激活档。本文件只声明"可选档位"与每档语义,
# 不重复写死阈值——阈值一律来自 simulation_contract.yaml / motion_capability.yaml。
#
# 每档字段含义:
#   description         人类可读用途
#   acceptance_level   本档对应的验收级别 (SMOKE/INTEGRATION/REGRESSION/RELEASE)
#   default_frames     本档默认帧数
#   backend            默认导航后端 (cpp_nav_core / ue_bridge / gazebo_nav2)
#   allow_mock         各子系统是否允许 mock/sim 后端, 以及约束
#     nav_core         false=禁止用 mock 替代确定性导航核
#     vision           true=允许 MiniCPM 视觉后端走 mock (必须画面标注)
#     puppypi          sim/mock/real 三选一; real 当前未验收, 默认 sim
#   enforce_single_source  true=运行前强制 geometry/motion/config 一致性门禁全绿
#                         (release 档必须 true, 禁止"配置漂移悄悄过关")
#   require_seed_sweep research 档要求多种子消融, 单 seed 不宣称结论
profiles:
  dev:
    description: 本地开发默认档, 快速冒烟
    acceptance_level: SMOKE
    default_frames: 300
    backend: cpp_nav_core
    allow_mock:
      nav_core: false
      vision: true
      puppypi: sim
    enforce_single_source: false
    require_seed_sweep: false
  research:
    description: 消融/论文实验档, 多种子批量回归
    acceptance_level: REGRESSION
    default_frames: 36000
    backend: cpp_nav_core
    allow_mock:
      nav_core: false
      vision: true
      puppypi: sim
    enforce_single_source: false
    require_seed_sweep: true
  release:
    description: 发布验收档, 严格且不可静默回退
    acceptance_level: RELEASE
    default_frames: 108000
    backend: cpp_nav_core
    allow_mock:
      nav_core: false
      vision: false
      puppypi: sim
    enforce_single_source: true
    require_seed_sweep: true
  demo:
    description: 答辩/视频展示档, 稳定优先
    acceptance_level: INTEGRATION
    default_frames: 9000
    backend: ue_bridge
    allow_mock:
      nav_core: false
      vision: true
      puppypi: sim
    enforce_single_source: false
    require_seed_sweep: false
