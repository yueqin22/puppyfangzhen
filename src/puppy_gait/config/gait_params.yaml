gait_controller:
  ros__parameters:
    control_rate: 100.0    # Hz, how often to publish joint commands
    gait_period: 0.5       # seconds, trot cycle period
    step_length: 0.08      # meters, forward step length
    step_height: 0.05      # meters, foot lift height during swing
    body_height: 0.205     # meters, PuppyPi nominal standing height
    thigh_length: 0.105
    calf_length: 0.115
    # Hip offsets in the body frame. These are the lever arm that turns a yaw
    # rate into per-leg foot motion, so they MUST match the URDF:
    #   x = body_length/2 - 0.02         = 0.130
    #   y = body_width/2 + hip_length/2  = 0.1125
    # Getting them wrong does not stop the robot walking; it silently scales
    # every turn and strafe.
    hip_half_length: 0.130
    hip_half_width: 0.1125
