# Safety configuration (gaijin2.md section 11.3, 14)
# P1-2: ROS2 标准参数格式，由 core_bringup 传给 safety_manager 节点
safety_manager:
  ros__parameters:
    # Battery thresholds
    low_battery_threshold: 0.20
    critical_battery_threshold: 0.10

    # Command timeout (seconds)
    cmd_vel_timeout: 1.0

    # Motor defaults
    motors_enabled_on_start: false  # gaijin2.md 14.6

    # Velocity limits (safety clamp)
    max_linear_x: 0.3
    max_angular_z: 1.2

    fall_detection_enabled: true
    fall_recovery_auto: false  # require manual confirmation
    max_recovery_attempts: 3
    safe_stop_on_driver_error: true

battery_status_adapter:
  ros__parameters:
    low_battery_threshold: 0.20
    critical_battery_threshold: 0.10

