slam_toolbox:
  ros__parameters:
    # Plugin type: async for online mapping, sync for offline
    plugin: slam_toolbox/AsyncSlamToolbox

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    # Map resolution
    resolution: 0.05

    # Laser range
    max_laser_range: 10.0

    # Movement thresholds for scan processing
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.5
    minimum_time_interval: 0.5

    # Loop closure
    do_loop_closing: true
    loop_match_minimum_variance_fine: 0.1
    loop_match_minimum_variance_coarse: 0.2
    loop_match_minimum_measurements: 10

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_time_interval: 0.5
    transform_publish_period: 0.02
    map_update_interval: 5.0

    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Debug
    debug_logging: false
    throttle_scans: 1
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # Map size
    map_start_angle: 0.0
